# Drop-in for the existing procura-material-import-worker.service on the VPS:
#   /etc/systemd/system/procura-material-import-worker.service.d/lane.conf
# Restricts it to bulk import queues once the procura-worker@ lanes run the outbox.
# Without this, it keeps running every outbox event too (safe, but a slow SMTP call
# would again delay imports in that process).
[Service]
ExecStart=
ExecStart=/var/www/procura/venv/bin/python3 -m app.material_import_worker --lane imports --interval 1
